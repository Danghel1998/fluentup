<meta charset="UTF-8">
<title>FluentUp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #F5F6F3;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --ink: #16231F;
    --muted: #5B6B66;
    --line: #DCE1DE;
    --teal: #0F6E63;
    --teal-strong: #0B554C;
    --teal-tint: rgba(15, 110, 99, 0.1);
    --gold: #B8792A;
    --gold-tint: rgba(184, 121, 42, 0.12);
    --good: #1F7A4D;
    --bad: #B23B3B;
    --shadow: 0 1px 2px rgba(22, 35, 31, 0.06), 0 8px 24px rgba(22, 35, 31, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E1614;
      --surface: #16211E;
      --surface-raised: #1B2825;
      --ink: #EAF0EC;
      --muted: #93A29B;
      --line: #263631;
      --teal: #52C2B3;
      --teal-strong: #78D4C7;
      --teal-tint: rgba(82, 194, 179, 0.14);
      --gold: #E0AC55;
      --gold-tint: rgba(224, 172, 85, 0.16);
      --good: #4FAE7C;
      --bad: #E07272;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0E1614;
    --surface: #16211E;
    --surface-raised: #1B2825;
    --ink: #EAF0EC;
    --muted: #93A29B;
    --line: #263631;
    --teal: #52C2B3;
    --teal-strong: #78D4C7;
    --teal-tint: rgba(82, 194, 179, 0.14);
    --gold: #E0AC55;
    --gold-tint: rgba(224, 172, 85, 0.16);
    --good: #4FAE7C;
    --bad: #E07272;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  a, button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .shell { min-height: 100vh; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { font-size: 1.4rem; transform: rotate(-6deg); display: inline-block; }
  .brand-name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.01em;
  }

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs a {
    text-decoration: none;
    color: var(--muted);
    padding: 8px 15px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }
  .tabs a:hover { background: var(--teal-tint); color: var(--ink); }
  .tabs a.active { background: var(--teal); color: #fff; }

  #app { max-width: 820px; margin: 0 auto; padding: 40px 24px 72px; }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.9rem;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.25rem;
    margin: 0 0 16px;
    text-wrap: balance;
  }
  p.subtitle { color: var(--muted); margin: 0 0 28px; max-width: 60ch; line-height: 1.5; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }

  /* --- Level picker: passport-stamp badges --- */
  .level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .level-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .level-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .level-card.selected { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }

  .stamp {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px dashed var(--teal);
    display: flex; align-items: center; justify-content: center;
    transform: rotate(-4deg);
    flex-shrink: 0;
  }
  .stamp span {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--teal);
    transform: rotate(4deg);
  }

  .level-name { font-weight: 600; font-size: 0.98rem; }
  .level-desc { color: var(--muted); font-size: 0.82rem; line-height: 1.4; }

  .level-progress-bar {
    height: 5px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
    margin-top: auto;
  }
  .level-progress-fill { height: 100%; background: var(--gold); }

  /* --- Buttons --- */
  .btn {
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    background: var(--teal);
    color: #fff;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--teal-strong); }
  .btn.secondary {
    background: var(--gold-tint);
    color: var(--gold);
    border: 1px solid transparent;
  }
  .btn.secondary:hover { background: var(--gold); color: #fff; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

  /* --- Flashcard: study index card --- */
  .flash-body { display: flex; flex-direction: column; gap: 16px; }
  .flashcard {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 52px 24px;
    text-align: center;
    cursor: pointer;
    min-height: 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    user-select: none;
    box-shadow: var(--shadow);
    position: relative;
  }
  .flashcard::before {
    content: "";
    position: absolute;
    left: 24px; right: 24px; top: 18px;
    border-top: 1px dashed var(--line);
  }
  .flashcard .word {
    font-family: "Fraunces", Georgia, serif;
    font-size: 2.1rem;
    font-weight: 600;
  }
  .flashcard .translation { font-size: 1.25rem; color: var(--teal); font-weight: 600; }
  .flashcard .word-row { display: flex; align-items: center; gap: 10px; }
  .pron-box {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--gold-tint);
    color: var(--gold);
    border: 1px dashed var(--gold);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 0.82rem;
    font-family: "IBM Plex Mono", monospace;
  }
  .pron-box strong { font-weight: 700; }

  .rule-card h2 { margin-bottom: 10px; }
  .rule-formula {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.88rem;
    color: var(--teal);
    background: var(--teal-tint);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .rule-use { color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .rule-examples { margin: 0; padding-left: 20px; }
  .rule-examples li { color: var(--ink); margin-bottom: 4px; line-height: 1.5; }
  .rule-examples li:last-child { margin-bottom: 0; }
  .flashcard .example-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; max-width: 44ch; }
  .flashcard .example { color: var(--muted); font-size: 0.95rem; }
  .flashcard .hint { color: var(--muted); font-size: 0.78rem; margin-top: 16px; text-transform: uppercase; letter-spacing: 0.06em; }
  .speak-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--teal-tint);
    color: var(--teal);
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  .speak-btn:hover { background: var(--teal); color: #fff; transform: scale(1.06); }

  .voice-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .voice-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-radius: 8px; background: var(--paper);
  }
  .voice-row-active { background: var(--teal-tint); box-shadow: inset 0 0 0 1px var(--teal); }
  .voice-name { font-size: 0.88rem; font-weight: 600; }
  .voice-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .voice-badge {
    font-size: 0.72rem; font-weight: 700; color: #fff; background: var(--teal);
    padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .voice-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .voice-try {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); color: var(--teal); cursor: pointer; font-size: 0.75rem;
    display: flex; align-items: center; justify-content: center;
  }
  .voice-try:hover { background: var(--teal); color: #fff; }
  .voice-use {
    border: 1px solid var(--teal); background: transparent; color: var(--teal);
    font-weight: 600; font-size: 0.78rem; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .voice-use:hover { background: var(--teal); color: #fff; }

  .rating-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .rating-row button {
    padding: 12px 6px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.83rem;
    color: #fff;
    transition: filter 0.15s;
  }
  .rating-row button:hover { filter: brightness(1.08); }
  .rate-again { background: var(--bad); }
  .rate-hard { background: var(--gold); }
  .rate-good { background: var(--teal); }
  .rate-easy { background: var(--good); }

  /* --- Grammar quiz --- */
  .quiz-option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px 16px;
    margin-bottom: 9px;
    border-radius: 10px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.98rem;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .quiz-option:hover { border-left-color: var(--teal); background: var(--teal-tint); }
  .quiz-option.correct { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
  .quiz-option.incorrect { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }

  .explanation {
    margin-top: 6px;
    padding: 13px 15px;
    border-radius: 10px;
    background: var(--gold-tint);
    color: var(--ink);
    font-size: 0.9rem;
    line-height: 1.5;
    border-left: 3px solid var(--gold);
  }

  /* --- Progress --- */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .stat-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-value {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.7rem;
    font-weight: 600;
    color: var(--teal);
  }
  .stat-label { color: var(--muted); font-size: 0.78rem; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

  .empty-state {
    text-align: center;
    padding: 44px 20px;
    color: var(--muted);
    line-height: 1.6;
  }

  .progress-list .level-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .progress-list .level-row:last-child { border-bottom: none; }
  .progress-list .level-tag {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    color: var(--teal);
    width: 30px;
  }
  .progress-list .bar-track { flex: 1; height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progress-list .bar-fill { height: 100%; background: var(--gold); }
  .progress-list .pct {
    width: 46px; text-align: right;
    color: var(--muted); font-size: 0.85rem;
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
  }

  /* --- Profile chip & gate --- */
  body.gated .tabs { display: none; }
  .profile-chip { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .profile-chip span { font-weight: 600; color: var(--ink); }
  .chip-logout {
    background: none; border: none; color: var(--teal);
    font-weight: 600; font-size: 0.82rem; cursor: pointer;
    padding: 4px 8px; border-radius: 6px;
  }
  .chip-logout:hover { background: var(--teal-tint); }

  .gate-card { max-width: 420px; }
  .gate-label {
    display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted);
    margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .gate-label:first-child { margin-top: 0; }
  .gate-input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font-size: 1rem; font-family: inherit;
  }
  .gate-input:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .gate-error {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: color-mix(in srgb, var(--bad) 12%, var(--surface));
    color: var(--bad); font-size: 0.85rem;
  }
</style>

<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">🛂</span><span class="brand-name">FluentUp</span></div>

  <main id="app"></main>
</div>

const STORAGE_KEY = "fluentup_progress_v1";
const DAY_MS = 24 * 60 * 60 * 1000;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    selectedLevel: "A1",
    cards: {},
    grammar: {},
    streak: { count: 0, lastDate: null },
  };
}

let state = loadState();

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ---------- Perfil con sincronización en la nube (capacidad db) ----------
const PROFILE_KEY = "fluentup_profile_v1";
let db = null;
let profile = null; // { slug, name, pin }

function slugify(name) {
  const stripDiacritics = new RegExp(
    "[" + String.fromCharCode(0x0300) + "-" + String.fromCharCode(0x036f) + "]",
    "g"
  );
  return name
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(stripDiacritics, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 60);
}

function loadLocalProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveLocalProfile(p) {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
}
function clearLocalProfile() {
  localStorage.removeItem(PROFILE_KEY);
}

function mergeRemoteIntoState(data) {
  state.selectedLevel = data.selectedLevel || state.selectedLevel;
  state.cards = data.cards || {};
  state.grammar = data.grammar || {};
  state.streak = data.streak || { count: 0, lastDate: null };
  saveState();
}

function pushToDb(patch) {
  if (!db || !profile) return;
  db.doc(`profiles/${profile.slug}`).update(patch).catch(() => {});
}

// ---------- Pronunciación (Web Speech API) ----------
// La calidad de la voz depende 100% de lo que el navegador/sistema
// operativo de quien la escucha tenga instalado — no existe forma de
// llamar a un servicio de voz neuronal de pago (ElevenLabs, Google Cloud,
// etc.) desde un Artifact. Lo máximo que podemos hacer es: esperar a que
// el navegador termine de cargar su lista de voces (se carga async y a
// veces llega tarde) y elegir la mejor disponible, evitando a propósito
// las voces "de escritorio" clásicas (David/Zira) que suenan más robóticas.
let cachedVoices = [];
function refreshVoices() {
  if ("speechSynthesis" in window) cachedVoices = window.speechSynthesis.getVoices();
}
function voicesReady() {
  return new Promise((resolve) => {
    refreshVoices();
    if (cachedVoices.length) return resolve();
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      refreshVoices();
      resolve();
    };
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = finish;
    }
    setTimeout(finish, 800);
  });
}
if ("speechSynthesis" in window) voicesReady();

function pickBestEnglishVoice() {
  const enVoices = cachedVoices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
  if (!enVoices.length) return null;
  const scored = enVoices.map((v) => {
    let score = 0;
    if (/neural|natural/i.test(v.name)) score += 6;
    if (/online/i.test(v.name)) score += 3;
    if (/google/i.test(v.name)) score += 3;
    if (/samantha|ava|allison|susan|zoe|nicky/i.test(v.name)) score += 3; // voces "enhanced" de Apple
    if (/desktop|david|zira|mark/i.test(v.name)) score -= 4; // SAPI5 clásicas, muy robóticas
    if (!v.localService) score += 2;
    if (/^en-US$/i.test(v.lang)) score += 1;
    return { v, score };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored[0].v;
}

// ---------- Preferencia manual de voz (elegida por la persona) ----------
const VOICE_PREF_KEY = "fluentup_voice_pref";
function loadVoicePref() {
  try {
    const raw = localStorage.getItem(VOICE_PREF_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveVoicePref(v) {
  localStorage.setItem(VOICE_PREF_KEY, JSON.stringify({ name: v.name, lang: v.lang }));
}
function clearVoicePref() {
  localStorage.removeItem(VOICE_PREF_KEY);
}

function getSelectedVoice() {
  const pref = loadVoicePref();
  if (pref) {
    const match = cachedVoices.find((v) => v.name === pref.name && v.lang === pref.lang);
    if (match) return match;
  }
  return pickBestEnglishVoice();
}

function speakWithVoice(text, voice, rate) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  if (voice) {
    utter.voice = voice;
    utter.lang = voice.lang;
  } else {
    utter.lang = "en-US";
  }
  utter.rate = rate || 0.95;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}

async function renderVoiceList(container) {
  if (!("speechSynthesis" in window)) {
    container.textContent = "Tu navegador no soporta lectura en voz alta (Web Speech API).";
    return;
  }
  await voicesReady();
  if (!cachedVoices.length) {
    container.textContent = "Tu navegador no reporta ninguna voz instalada.";
    return;
  }
  const selected = getSelectedVoice();
  const hasManualPref = !!loadVoicePref();
  const sorted = [...cachedVoices].sort((a, b) => {
    const aEn = a.lang.toLowerCase().startsWith("en") ? 0 : 1;
    const bEn = b.lang.toLowerCase().startsWith("en") ? 0 : 1;
    if (aEn !== bEn) return aEn - bEn;
    return a.name.localeCompare(b.name);
  });

  const resetHtml = hasManualPref
    ? `<button class="btn secondary voice-reset" id="voice-reset" style="margin-bottom:12px;">Volver a elegir automáticamente</button>`
    : "";

  container.innerHTML =
    resetHtml +
    sorted
      .map((v, i) => {
        const isEnglish = v.lang.toLowerCase().startsWith("en");
        const isSelected = selected && v.name === selected.name && v.lang === selected.lang;
        return `
          <div class="voice-row${isSelected ? " voice-row-active" : ""}">
            <div>
              <div class="voice-name">${v.name}</div>
              <div class="voice-meta">${v.lang} · ${v.localService ? "local" : "en línea"}</div>
            </div>
            <div class="voice-actions">
              ${isSelected ? '<span class="voice-badge">En uso</span>' : ""}
              ${isEnglish ? `<button class="voice-try" data-idx="${i}" title="Escuchar esta voz">▶</button>` : ""}
              ${isEnglish && !isSelected ? `<button class="voice-use" data-idx="${i}">Usar</button>` : ""}
            </div>
          </div>
        `;
      })
      .join("");

  container.querySelectorAll(".voice-try").forEach((btn) => {
    btn.addEventListener("click", () => {
      const v = sorted[parseInt(btn.dataset.idx, 10)];
      speakWithVoice("Hello! This is how I sound reading your English examples.", v);
    });
  });
  container.querySelectorAll(".voice-use").forEach((btn) => {
    btn.addEventListener("click", () => {
      const v = sorted[parseInt(btn.dataset.idx, 10)];
      saveVoicePref(v);
      renderVoiceList(container);
    });
  });
  const resetBtn = container.querySelector("#voice-reset");
  if (resetBtn) {
    resetBtn.addEventListener("click", () => {
      clearVoicePref();
      renderVoiceList(container);
    });
  }
}

async function speakEnglish(text, rate) {
  if (!("speechSynthesis" in window)) return;
  await voicesReady();
  speakWithVoice(text, getSelectedVoice(), rate);
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function bumpStreak() {
  const today = todayStr();
  if (state.streak.lastDate === today) return;
  const yesterday = new Date(Date.now() - DAY_MS).toISOString().slice(0, 10);
  if (state.streak.lastDate === yesterday) {
    state.streak.count += 1;
  } else {
    state.streak.count = 1;
  }
  state.streak.lastDate = today;
  saveState();
  pushToDb({ streak: state.streak });
}

function reviewCard(id, quality) {
  let c = state.cards[id] || { ef: 2.5, interval: 0, reps: 0, due: Date.now() };
  if (quality < 3) {
    c.reps = 0;
    c.interval = 1;
  } else {
    if (c.reps === 0) c.interval = 1;
    else if (c.reps === 1) c.interval = 6;
    else c.interval = Math.round(c.interval * c.ef);
    c.reps += 1;
  }
  c.ef = Math.max(1.3, c.ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  c.due = Date.now() + c.interval * DAY_MS;
  state.cards[id] = c;
  saveState();
  pushToDb({ cards: { [id]: c } });
}

function getDueCards(level) {
  const all = VOCAB[level] || [];
  const now = Date.now();
  const due = all.filter((w) => {
    const c = state.cards[w.id];
    return c && c.due <= now;
  });
  const fresh = all.filter((w) => !state.cards[w.id]);
  return due.concat(fresh);
}

function levelMastery(level) {
  const all = VOCAB[level] || [];
  if (all.length === 0) return 0;
  const learned = all.filter((w) => state.cards[w.id] && state.cards[w.id].reps >= 2).length;
  return Math.round((learned / all.length) * 100);
}

function grammarAccuracy(level) {
  const g = state.grammar[level];
  if (!g || g.total === 0) return null;
  return Math.round((g.correct / g.total) * 100);
}

const routes = { home: renderHome, flashcards: renderFlashcards, grammar: renderGrammar, rules: renderRules, progress: renderProgress };

function router() {
  const hash = location.hash.replace("#/", "") || "home";
  const route = routes[hash] ? hash : "home";
  document.querySelectorAll(".tabs a").forEach((a) => {
    a.classList.toggle("active", a.dataset.route === route);
  });
  const app = document.getElementById("app");
  app.innerHTML = "";
  renderProfileChip();

  if (db && !profile) {
    document.body.classList.add("gated");
    renderGate(app);
    return;
  }
  document.body.classList.remove("gated");
  routes[route](app);
}

function renderProfileChip() {
  const chip = document.getElementById("profile-chip");
  if (!chip) return;
  if (profile) {
    chip.hidden = false;
    chip.innerHTML = `<span>👤 ${profile.name}</span><button class="chip-logout" id="logout-btn">Cambiar</button>`;
    chip.querySelector("#logout-btn").addEventListener("click", () => {
      clearLocalProfile();
      profile = null;
      router();
    });
  } else {
    chip.hidden = true;
  }
}

function renderGate(app) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <h1>¿Quién eres? 👋</h1>
    <p class="subtitle">Escribe tu nombre y un PIN de 4 dígitos. Si ya tenías un perfil, úsalos para recuperar tu progreso desde cualquier dispositivo.</p>
    <div class="card gate-card">
      <label class="gate-label" for="gate-name">Nombre</label>
      <input type="text" id="gate-name" class="gate-input" placeholder="Ej: Daniel" autocomplete="name">
      <label class="gate-label" for="gate-pin">PIN (4 dígitos)</label>
      <input type="password" id="gate-pin" class="gate-input" placeholder="••••" inputmode="numeric" maxlength="4" autocomplete="off">
      <div class="gate-error" id="gate-error" hidden></div>
      <div class="btn-row">
        <button class="btn" id="gate-submit">Entrar</button>
      </div>
    </div>
  `;
  app.appendChild(wrap);

  const nameInput = wrap.querySelector("#gate-name");
  const pinInput = wrap.querySelector("#gate-pin");
  const errorBox = wrap.querySelector("#gate-error");
  const submitBtn = wrap.querySelector("#gate-submit");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.hidden = false;
  }

  async function submit() {
    const name = nameInput.value.trim();
    const pin = pinInput.value.trim();
    errorBox.hidden = true;
    if (!name) return showError("Escribe tu nombre.");
    const slug = slugify(name);
    if (!slug) return showError("Ese nombre no es válido, usa letras o números.");
    if (!/^\d{4}$/.test(pin)) return showError("El PIN debe tener 4 dígitos.");

    submitBtn.disabled = true;
    submitBtn.textContent = "Entrando...";
    try {
      const ref = db.doc(`profiles/${slug}`);
      const snap = await ref.get();
      if (snap.exists) {
        if (snap.data().pin !== pin) {
          showError("Ese nombre ya está en uso con otro PIN. Prueba otro nombre o revisa tu PIN.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Entrar";
          return;
        }
        mergeRemoteIntoState(snap.data());
      } else {
        const fresh = {
          name,
          pin,
          selectedLevel: "A1",
          cards: {},
          grammar: {},
          streak: { count: 0, lastDate: null },
        };
        await ref.set(fresh);
        mergeRemoteIntoState(fresh);
      }
      profile = { slug, name, pin };
      saveLocalProfile(profile);
      router();
    } catch (e) {
      showError("No se pudo conectar. Intenta de nuevo.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Entrar";
    }
  }

  submitBtn.addEventListener("click", submit);
  pinInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submit();
  });
}

(async function boot() {
  try {
    db = await claude.use("db");
  } catch (e) {
    db = null;
  }

  const saved = loadLocalProfile();
  if (db && saved) {
    try {
      const snap = await db.doc(`profiles/${saved.slug}`).get();
      if (snap.exists && snap.data().pin === saved.pin) {
        profile = saved;
        mergeRemoteIntoState(snap.data());
      } else {
        clearLocalProfile();
      }
    } catch (e) {
      profile = saved; // sin conexión: confiar en la copia local por ahora
    }
  }

  window.addEventListener("hashchange", router);
  router();
})();

  `;
  div.appendChild(cta);
  app.appendChild(div);

  cta.querySelector("#go-flash").addEventListener("click", () => (location.hash = "#/flashcards"));
  cta.querySelector("#go-gram").addEventListener("click", () => (location.hash = "#/grammar"));
}

function renderFlashcards(app) {
  const level = state.selectedLevel;
  const queue = getDueCards(level);

  const wrap = document.createElement("div");
  wrap.innerHTML = `<h1>Vocabulario · ${level}</h1><p class="subtitle">Toca la tarjeta para ver la traducción.</p>`;

  if (queue.length === 0) {
    wrap.innerHTML += `<div class="empty-state">🎉 No hay tarjetas pendientes por ahora en este nivel.<br>Vuelve más tarde o cambia de nivel en Inicio.</div>`;
    app.appendChild(wrap);
    return;
  }

  let idx = 0;
  let revealed = false;

  const cardEl = document.createElement("div");
  cardEl.className = "flashcard";

  const ratingEl = document.createElement("div");
  ratingEl.className = "rating-row";
  ratingEl.style.display = "none";
  ratingEl.innerHTML = `
    <button class="rate-again" data-q="1">Otra vez</button>
    <button class="rate-hard" data-q="3">Difícil</button>
    <button class="rate-good" data-q="4">Bien</button>
    <button class="rate-easy" data-q="5">Fácil</button>
  `;

  const progressLabel = document.createElement("p");
  progressLabel.className = "subtitle";
  progressLabel.style.marginBottom = "0";

  function draw() {
    const word = queue[idx];
    progressLabel.textContent = `Tarjeta ${idx + 1} de ${queue.length}`;
    if (!revealed) {
      cardEl.innerHTML = `<div class="word">${word.en}</div><div class="hint">Toca para revelar</div>`;
      ratingEl.style.display = "none";
    } else {
      cardEl.innerHTML = `
        <div class="word-row">
          <div class="word">${word.en}</div>
          <button class="speak-btn" id="speak-word-btn" title="Escuchar solo la palabra" aria-label="Escuchar solo la palabra">🔊</button>
        </div>
        <div class="pron-box">se pronuncia: <strong>${word.pron}</strong></div>
        <div class="translation">${word.es}</div>
        <div class="example-row">
          <div class="example">"${word.example}"</div>
          <button class="speak-btn" id="speak-example-btn" title="Escuchar la oración" aria-label="Escuchar la oración">🔊</button>
        </div>
      `;
      ratingEl.style.display = "grid";
      cardEl.querySelector("#speak-word-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        speakEnglish(word.en, 0.65);
      });
      cardEl.querySelector("#speak-example-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        speakEnglish(word.example, 0.65);
      });
    }
  }

  cardEl.addEventListener("click", () => {
    if (!revealed) {
      revealed = true;
      draw();
      speakEnglish(queue[idx].en, 0.65);
    }
  });

  ratingEl.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const q = parseInt(btn.dataset.q, 10);
      reviewCard(queue[idx].id, q);
      bumpStreak();
      idx += 1;
      revealed = false;
      if (idx >= queue.length) {
        wrap.querySelector(".flash-body").innerHTML = `<div class="empty-state">✅ ¡Terminaste esta sesión de ${queue.length} tarjetas!</div>`;
        return;
      }
      draw();
    });
  });

  const body = document.createElement("div");
  body.className = "flash-body";
  body.appendChild(progressLabel);
  body.appendChild(cardEl);
  body.appendChild(ratingEl);
  wrap.appendChild(body);
  app.appendChild(wrap);
  draw();
}

function renderGrammar(app) {
  const level = state.selectedLevel;
  const all = GRAMMAR[level] || [];
  if (!state.grammar[level]) state.grammar[level] = { correct: 0, total: 0, answered: [] };
  const g = state.grammar[level];

  const unanswered = all.filter((q) => !g.answered.includes(q.id));
  const queue = unanswered.length > 0 ? unanswered : all;

  const wrap = document.createElement("div");
  wrap.innerHTML = `<h1>Gramática · ${level}</h1><p class="subtitle">Elige la opción correcta.</p>`;

  if (queue.length === 0) {
    wrap.innerHTML += `<div class="empty-state">No hay preguntas para este nivel todavía.</div>`;
    app.appendChild(wrap);
    return;
  }

  let idx = 0;
  let answered = false;

  const body = document.createElement("div");
  body.className = "card";

  function draw() {
    const item = queue[idx];
    body.innerHTML = `
      <p class="subtitle" style="margin-bottom:6px;">Pregunta ${idx + 1} de ${queue.length}</p>
      <h2>${item.q}</h2>
      <div class="options"></div>
      <div class="explanation-slot"></div>
      <div class="btn-row next-slot"></div>
    `;
    const optionsDiv = body.querySelector(".options");
    item.options.forEach((opt) => {
      const b = document.createElement("button");
      b.className = "quiz-option";
      b.textContent = opt;
      b.addEventListener("click", () => {
        if (answered) return;
        answered = true;
        const isCorrect = opt === item.answer;
        b.classList.add(isCorrect ? "correct" : "incorrect");
        if (!isCorrect) {
          [...optionsDiv.children].forEach((c) => {
            if (c.textContent === item.answer) c.classList.add("correct");
          });
        }
        if (!g.answered.includes(item.id)) {
          g.answered.push(item.id);
          g.total += 1;
          if (isCorrect) g.correct += 1;
          saveState();
          pushToDb({ grammar: { [level]: g } });
          bumpStreak();
        }
        body.querySelector(".explanation-slot").innerHTML = `<div class="explanation">💡 ${item.explanation}</div>`;
        const nextSlot = body.querySelector(".next-slot");
        const nextBtn = document.createElement("button");
        nextBtn.className = "btn";
        nextBtn.textContent = idx + 1 < queue.length ? "Siguiente →" : "Terminar";
        nextBtn.addEventListener("click", () => {
          idx += 1;
          answered = false;
          if (idx >= queue.length) {
            body.innerHTML = `<div class="empty-state">✅ ¡Completaste ${queue.length} preguntas de ${level}!</div>`;
            return;
          }
          draw();
        });
        nextSlot.appendChild(nextBtn);
      });
      optionsDiv.appendChild(b);
    });
  }

  draw();
  wrap.appendChild(body);
  app.appendChild(wrap);
}

function renderRules(app) {
  const level = state.selectedLevel;
  const rules = GRAMMAR_RULES[level] || [];

  const wrap = document.createElement("div");
  wrap.innerHTML = `<h1>Reglas de gramática · ${level}</h1><p class="subtitle">Repasa la teoría antes (o después) de practicar en Gramática.</p>`;

  if (rules.length === 0) {
    wrap.innerHTML += `<div class="empty-state">No hay reglas para este nivel todavía.</div>`;
    app.appendChild(wrap);
    return;
  }

  rules.forEach((rule) => {
    const card = document.createElement("div");
    card.className = "card rule-card";
    card.innerHTML = `
      <h2>${rule.title}</h2>
      <div class="rule-formula">${rule.formula}</div>
      <p class="rule-use">${rule.use}</p>
      <ul class="rule-examples">
        ${rule.examples.map((ex) => `<li>${ex}</li>`).join("")}
      </ul>
    `;
    wrap.appendChild(card);
  });

  app.appendChild(wrap);
}

function renderProgress(app) {
  const totalWords = Object.values(state.cards).filter((c) => c.reps >= 2).length;
  const wrap = document.createElement("div");
  wrap.innerHTML = `<h1>Tu progreso</h1><p class="subtitle">Sigue practicando un poco cada día.</p>`;

  const stats = document.createElement("div");
  stats.className = "stat-row";
  stats.innerHTML = `
    <div class="stat-box"><div class="stat-value">${state.streak.count}</div><div class="stat-label">Días seguidos</div></div>
    <div class="stat-box"><div class="stat-value">${totalWords}</div><div class="stat-label">Palabras aprendidas</div></div>
  `;
  wrap.appendChild(stats);

  const listCard = document.createElement("div");
  listCard.className = "card progress-list";
  listCard.innerHTML = `<h2>Dominio de vocabulario por nivel</h2>`;
  LEVELS.forEach((lvl) => {
    const pct = levelMastery(lvl);
    const row = document.createElement("div");
    row.className = "level-row";
    row.innerHTML = `
      <div class="level-tag">${lvl}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="pct">${pct}%</div>
    `;
    listCard.appendChild(row);
  });
  wrap.appendChild(listCard);

  const gramCard = document.createElement("div");
  gramCard.className = "card progress-list";
  gramCard.innerHTML = `<h2>Precisión en gramática por nivel</h2>`;
  LEVELS.forEach((lvl) => {
    const acc = grammarAccuracy(lvl);
    const row = document.createElement("div");
    row.className = "level-row";
    row.innerHTML = `
      <div class="level-tag">${lvl}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${acc === null ? 0 : acc}%"></div></div>
      <div class="pct">${acc === null ? "—" : acc + "%"}</div>
    `;
    gramCard.appendChild(row);
  });
  wrap.appendChild(gramCard);

  const voiceCard = document.createElement("div");
  voiceCard.className = "card";
  voiceCard.innerHTML = `
    <h2>🔊 Voces de tu navegador</h2>
    <p class="subtitle" style="margin-bottom:12px;">Esta es la lista de voces que tu navegador tiene instaladas ahora mismo. La marcada como "En uso" es la que FluentUp elige para leer los ejemplos.</p>
    <div id="voice-list" class="voice-list">Buscando voces...</div>
  `;
  wrap.appendChild(voiceCard);

  app.appendChild(wrap);
  renderVoiceList(voiceCard.querySelector("#voice-list"));
}
</script>
